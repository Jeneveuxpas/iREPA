# AttnScaf-only JiT-B/16 training. DINO K/V scaffold block 4 for the first
# 20k optimizer steps; the remaining steps use native attention with K/V loss.
model: JiT-B/16
img_size: 256
class_num: 1000

enable_repa: false
enable_attnscaf: true
enc_type: dinov2-vit-b

# JiT-B inserts in-context tokens before block 5, so scaffold block 4.
attnscaf_layer: 6
attnscaf_enc_layer: 12
attnscaf_kv_proj: linear
attnscaf_kv_norm: none
stage1_steps: 20000
transition_steps: 0
distill_coeff: 0.2
attnscaf_loss_type: kv_mse

max_train_steps: 100000
epochs: 20

projection_layer_type: mlp
projection_loss_type: cosine
proj_coeff: "0.0"
spnorm_method: none