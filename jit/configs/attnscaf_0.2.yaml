# AttnScaf (scaffold block 4) + REPA (align block 6), JiT-B/16.
model: JiT-B/16
img_size: 256
class_num: 1000

enable_attnscaf: true
enable_repa: true
enc_type: dinov2-vit-b

attnscaf_layer: 4
attnscaf_enc_layer: 12
attnscaf_kv_proj: linear
attnscaf_kv_norm: none
stage1_steps: 20000
transition_steps: 0
distill_coeff: 0.2
attnscaf_loss_type: kv_cos

encoder_depth: 6
projection_layer_type: mlp
projection_loss_type: cosine
proj_coeff: "0.1"
spnorm_method: none

batch_size: 128
epochs: 200
max_train_steps: 100000