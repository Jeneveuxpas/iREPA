# Ablation: REPA + scaffold warm-up WITHOUT the consistency loss.
# Stage 1 (0-20k) replaces block-6 K/V with the encoder's; from 20k the model
# switches back to native attention with distill_coeff = 0, so nothing carries
# the scaffold's behaviour over.  Isolates whether the hand-off loss is what
# makes AttnScaf work, or whether the warm-up alone is enough.
model: JiT-B/16
img_size: 256
class_num: 1000

enable_repa: true
enable_attnscaf: true
enc_type: dinov2-vit-b

projection_layer_type: mlp
projection_loss_type: cosine
proj_coeff: "0.5"
spnorm_method: none

# Effective batch is batch_size * world_size, and lr = blr * eff_batch / 256.
batch_size: 128        # 2 GPUs -> effective batch 256, lr 5e-5
epochs: 200
max_train_steps: 200000

encoder_depth: 6
attnscaf_layer: 6
attnscaf_enc_layer: 12
attnscaf_kv_proj: linear
attnscaf_kv_norm: none
stage1_steps: 20000
transition_steps: 0
distill_coeff: 0.0        # consistency loss OFF -- this is the ablation
attnscaf_loss_type: kv_cos